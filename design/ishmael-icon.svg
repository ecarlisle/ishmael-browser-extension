<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ishmael extension icon — original white-whale mark.

  An original, stylized white sperm whale silhouette (broad squared head,
  gently raised tail) on a deep ocean-teal circular field, drawn for the
  Ishmael browser extension. The whale references Herman Melville's Moby-Dick
  narrator without reproducing any existing illustration or logo; the artwork
  is original and repository-owned.

  Design notes:
    - Flat colors only (no gradients, text, or small decorative details).
    - Sperm whale cues: the large blunt head block (~1/3 of body length)
      instead of a generic fish or beluga profile, and a raised tail.
    - Deep teal circle uses the extension palette accent-strong (#115e59);
      the whale is pure white for high contrast on both light and dark
      toolbar themes. Transparency is preserved outside the circle.
    - viewBox is 1024 so small sizes (16px) simply area-average the same
      bold shapes; no thin features exist to blur away.

  Regeneration:
    1. Rasterize this file to a 512px master PNG (8-bit RGBA, required by
       scripts/render-icons.mjs):
         magick -background none -density 144 design/ishmael-icon.svg \
                -resize 512x512 -depth 8 design/ishmael-icon-master.png
    2. Run `pnpm icons` to downsample the master to the committed sizes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 1024 1024">
  <!-- Deep ocean-teal circular field; transparent outside the circle. -->
  <circle cx="512" cy="512" r="460" fill="#115e59" />

  <!-- White sperm whale silhouette, facing right, raised tail. -->
  <g transform="translate(0, 34) translate(512, 478) scale(1.15) translate(-512, -478)">
    <path
      fill="#ffffff"
      d="M 120 220
         C 190 285, 240 315, 285 350
         C 235 380, 185 415, 140 460
         C 200 480, 270 515, 330 540
         C 370 575, 430 625, 480 655
         C 540 686, 620 700, 700 702
         C 770 704, 820 696, 852 672
         C 866 658, 872 640, 872 610
         C 872 545, 872 500, 868 478
         C 840 458, 806 448, 770 446
         C 660 452, 560 458, 480 462
         C 430 466, 390 468, 350 470
         C 250 380, 170 300, 120 220
         Z" />
  </g>
</svg>
